server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${PUBLIC_IP};
    location /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    location / { return 308 ${PUBLIC_ORIGIN}$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name ${PUBLIC_IP};
    ssl_certificate /etc/letsencrypt/live/onepost-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onepost-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    location = / { return 302 /admin/; }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
