server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${PUBLIC_IP};
    location /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    # Never expose login/passwords over unencrypted HTTP during bootstrap.
    location / { return 503 'HTTPS certificate is not ready.\n'; }
}
