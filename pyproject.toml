[project]
name = "postmastertelegram"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mahmoud20212", email = "occee123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "aiogram>=3.0,<4.0",
    "Telethon>=1.34,<2.0",
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
    "cryptography>=42.0,<46.0",
]

[project.scripts]
postmastertelegram = "postmastertelegram:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
