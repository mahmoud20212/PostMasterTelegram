services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  celery-worker:
    build: .
    user: "1000:1000"
    restart: unless-stopped
    command: celery -A config worker --loglevel=INFO --pool=solo
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    build: .
    user: "1000:1000"
    restart: unless-stopped
    command: celery -A config beat --loglevel=INFO
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    user: "1000:1000"
    restart: unless-stopped
    command: python -m bot.main
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    user: "1000:1000"
    restart: unless-stopped
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --timeout 60
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
